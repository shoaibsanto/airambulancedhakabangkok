<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Air ambulance aircraft flying from Dhaka to Bangkok with medical cross symbol" preserveAspectRatio="xMidYMid meet" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="55%" stop-color="#1e5f8e"/>
      <stop offset="100%" stop-color="#3aa5d6"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde6ef"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff5252" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5252" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- Stars (subtle) -->
  <circle cx="80" cy="50" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="180" cy="30" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="500" cy="60" r="1.0" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="20" r="0.9" fill="#ffffff" opacity="0.5"/>

  <!-- Distant clouds (background) -->
  <g opacity="0.35">
    <ellipse cx="120" cy="120" rx="55" ry="14" fill="url(#cloudGrad)"/>
    <ellipse cx="480" cy="100" rx="70" ry="16" fill="url(#cloudGrad)"/>
  </g>

  <!-- Mid clouds -->
  <g opacity="0.55">
    <ellipse cx="200" cy="220" rx="80" ry="20" fill="url(#cloudGrad)"/>
    <ellipse cx="450" cy="280" rx="100" ry="22" fill="url(#cloudGrad)"/>
  </g>

  <!-- Flight path: dashed arc from Dhaka (left) to Bangkok (right) -->
  <path d="M 80,300 Q 300,80 540,200" stroke="#7ad7ff" stroke-width="2.5" stroke-dasharray="6,8" fill="none" opacity="0.65"/>

  <!-- Dhaka marker (left) -->
  <g transform="translate(80, 300)">
    <circle r="8" fill="#ff5252"/>
    <circle r="14" fill="url(#glow)"/>
    <text x="-20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Dhaka</text>
  </g>

  <!-- Bangkok marker (right) -->
  <g transform="translate(540, 200)">
    <circle r="8" fill="#ffd54f"/>
    <circle r="14" fill="#ffd54f" opacity="0.3"/>
    <text x="0" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Bangkok</text>
  </g>

  <!-- Plane body -->
  <g transform="translate(310, 130) rotate(20)">
    <!-- Fuselage -->
    <path d="M -80,0 L 60,0 Q 80,0 80,-8 L 80,8 Q 80,16 60,16 L -80,16 Z" fill="url(#plane)" stroke="#0a2540" stroke-width="1.2"/>
    <!-- Tail -->
    <path d="M -80,0 L -90,-22 L -75,-22 L -68,0 Z M -80,0 L -90,22 L -75,22 L -68,0 Z" fill="#0a2540"/>
    <!-- Wings -->
    <path d="M -10,8 L 30,8 L 38,40 L -2,40 Z" fill="#0a2540" opacity="0.85"/>
    <path d="M -10,-8 L 30,-8 L 38,-40 L -2,-40 Z" fill="#0a2540" opacity="0.85"/>
    <!-- Cockpit window -->
    <path d="M 50,-6 Q 75,-6 78,0 Q 75,6 50,6 Z" fill="#3aa5d6" opacity="0.8"/>
    <!-- Medical cross on fuselage (red) -->
    <g transform="translate(-20, 8)">
      <rect x="-12" y="-3" width="24" height="6" fill="#ff3030"/>
      <rect x="-3" y="-12" width="6" height="24" fill="#ff3030"/>
      <rect x="-12" y="-3" width="24" height="6" fill="#ff3030" stroke="#ffffff" stroke-width="0.5"/>
      <rect x="-3" y="-12" width="6" height="24" fill="#ff3030" stroke="#ffffff" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Heartbeat/ECG line in lower right corner -->
  <g transform="translate(60, 350)" stroke="#ff5252" stroke-width="2.5" fill="none">
    <path d="M 0,0 L 50,0 L 60,-15 L 70,15 L 80,-25 L 90,0 L 200,0"/>
    <text x="220" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">ICU MONITORING</text>
  </g>

  <!-- Bottom info bar -->
  <rect x="0" y="370" width="600" height="30" fill="#000000" opacity="0.4"/>
  <text x="300" y="390" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">24/7 ICU-Equipped Air Ambulance · Bed-to-Bed Transfer · Doctor Escort</text>
</svg>
